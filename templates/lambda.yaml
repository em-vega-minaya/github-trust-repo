AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Template para definir una función Lambda que utiliza un rol IAM externo y un bucket específico

Parameters:
  Stage:
    Type: String
    Description: Ambiente (dev, qa, prod)
    Default: dev
  AWSRegion:
    Type: String
    Description: Región de AWS

Globals:
  Function:
    Runtime: python3.9
    Handler: lambda_function.lambda_handler

Resources:
  MyLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "function-${Stage}"
      Description: "Función Lambda que utiliza un rol externo"
      Runtime: python3.9
      MemorySize: 256
      Timeout: 30
      Role: !ImportValue LambdaMisupplyRole-Arn
      CodeUri:
        Bucket: prueba-exampe-josemaria-git
        Key: lambda/stage_misupply/src/
      Environment:
        Variables:
          ENVIRONMENT: !Ref Stage
          REGION: !Ref AWSRegion
      Events:
        CronTrigger:
          Type: Schedule
          Properties:
            Schedule: "cron(0 21 * * ? *)" # Se ejecuta todos los días a las 21:00 UTC


