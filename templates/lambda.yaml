AWSTemplateFormatVersion: 2010-09-09

Parameters:
  Stage:
    Type: String
    Description: Environment name (dev/qa/prod)
    Default: dev
  pTeamName:
    Type: String
    Description: "Name of the team owning the pipeline (all lowercase, no symbols or spaces)"
    Default: da
  pCuenta:
    Type: String
    Description: "Name of the account owning the pipeline (all lowercase, no symbols or spaces)"
    Default: ecodistribucion
  pProyecto:
    Type: String
    Description: "Name of the project owning the pipeline (all lowercase, no symbols or spaces)"
    Default: misupply
  AWSRegion:
    Type: String
    Description: AWS Region
  LIBbucket:
    Type: String
    Description: Bucket for artifacts

Resources:
  myLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "function-${Stage}"
      Description: "Dynamically deployed Lambda function"
      MemorySize: 256
      Timeout: 30
      Code:
        S3Bucket: test-artifacts-dev-josemaria
        S3Key: lambda/stage_misupply/src/lambda_function.zip
      Role: !ImportValue LambdaMisupplyRole-Arn
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      Environment:
        Variables:
          ENVIRONMENT: !Ref Stage
          REGION: !Ref AWSRegion
      Layers:
        - !Ref dataWranglerLayer
        - !Ref requestLayer

  dataWranglerLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleRuntimes:
        - python3.9
      Content:
        S3Bucket: !ImportValue da-ArtifactsBucketlibName
        S3Key: layers/awswrangler-layer-py3-9.zip
      Description: Data Wrangler Layer for Python 3.9
      LayerName: !Sub awswrangler-layer-py3-9-${Stage}

  requestLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      CompatibleRuntimes:
        - python3.9
      Content:
        S3Bucket: !ImportValue da-ArtifactsBucketlibName
        S3Key: layers/request-layer-py3-9.zip
      Description: Request Layer for Python 3.9
      LayerName: !Sub request-layer-py3-9-${Stage}
