AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  Stage:
    Type: String
    Description: Environment name (dev/qa/prod)
    Default: dev
  pTeamName:
    Description: "Name of the team owning the pipeline (all lowercase, no symbols or spaces)"
    Type: String
    Default: da
  pCuenta:
    Description: "Name of the account owning the pipeline (all lowercase, no symbols or spaces)"
    Type: String
    Default: ecodistribucion
  pProyecto:
    Description: "Name of the project owning the pipeline (all lowercase, no symbols or spaces)"
    Type: String
    Default: misupply
  AWSRegion:
    Type: String
    Description: AWS Region

Globals:
  Function:
      Runtime: python3.9
      Handler: lambda_function.lambda_handler

Resources:
  myLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "function-${Stage}"
      Description: "Lambda function desplegada dinámicamente"
      MemorySize: 256
      Timeout: 30
      Code:
          ZipFile: |
            def lambda_handler(event, context):
                return {
                    'statusCode': 200,
                    'body': 'Hola Mundo'
                }
      Role: !ImportValue LambdaMisupplyRole-Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Stage
          REGION: !Ref AWSRegion
      Layers:
        - !Ref dataWranglerLayer
        - !Ref requestLayer
      
  dataWranglerLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      CompatibleRuntimes:
        - python3.9
      ContentUri:
        Bucket: !ImportValue da-ArtifactsBucketlibName
        Key: layers/awswrangler-layer-py3-9.zip
      Description: Data Wrangler Layer for Python 3.9
      LayerName: !Sub awswrangler-layer-py3-9-${Stage}

  requestLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      CompatibleRuntimes:
        - python3.12
      ContentUri:
        Bucket: !ImportValue da-ArtifactsBucketlibName
        Key: layers/request-py3-12.zip
      Description: Request Layer for Python 3.12
      LayerName: !Sub request-py3-12-${Stage}

