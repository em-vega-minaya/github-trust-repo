name: Sync File to S3

on:
  push:
    branches:
      - develop # Solo se ejecutará cuando haya cambios en la rama develop

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AWS_BUCKET_NAME: "prueba-exampe-josemaria-git"
      REGION: "us-east-1"
      ARTIFACTS_S3: "test-artifacts-dev-josemaria"
      AWS_ACCOUNT_ID: "345345345345"
      AWS_ACCOUNT_OPTIMIZADOR: "5345345345"
      ENVIRONMENT: "dev"
    steps:
      - name: Set timestamp
        run: |
          echo "TIMESTAMP=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Define environment
        run: |
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=${{ github.base_ref }}" >> $GITHUB_ENV
          fi

      - name: Checkout Repo
        uses: actions/checkout@v2

      # Configura las credenciales de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-session-name: awssyncsession
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Sincroniza archivos locales con S3
      # - name: Sync Folder to S3
      #  run: |
      #    aws s3 sync ./stabe_lib s3://$AWS_BUCKET_NAME/
      #    echo "Folder synchronized to S3 bucket: $AWS_BUCKET_NAME"

      # Despliegue del stack S3
      - name: Deploy S3
        id: s3
        run: |
          aws cloudformation deploy --template-file templates/s3.yaml \
            --region $REGION \
            --stack-name da-josemaria-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides Stage=$ENVIRONMENT \
              ArtifactsBucket=$ARTIFACTS_S3 AWSRegion=$REGION \
              AWSAccountId=$AWS_ACCOUNT_ID

      # Despliegue del stack IAM
      - name: Deploy IAM
        id: iam
        run: |
          aws cloudformation deploy --template-file templates/iam.yaml \
            --region $REGION \
            --stack-name da-josemaria-iam \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides Stage=$ENVIRONMENT \
              AWSRegion=$REGION AWSAccountId=$AWS_ACCOUNT_ID

      # Subida de capas a S3
      - name: Upload layers to S3
        run: |
          aws s3 cp ./layers/awswrangler-layer-py3-9.zip s3://$ARTIFACTS_S3/layers/
          aws s3 cp ./layers/request-layer-py3-12.zip s3://$ARTIFACTS_S3/layers/

          awswrangler_layer_py3_9_md5=$(md5sum ./layers/awswrangler-layer-py3-9.zip | awk '{print $1}')
          request_layer_py3_12_md5=$(md5sum ./layers/request-layer-py3-12.zip | awk '{print $1}')

          echo "awswranglerlayerpy39MD5=$awswrangler_layer_py3_9_md5" >> $GITHUB_ENV
          echo "requestlayerpy312MD5=$request_layer_py3_12_md5" >> $GITHUB_ENV

      - name: Deploy Lambda
        id: lambda
        shell: bash
        env:
          STACK_NAME: da-josemaria-lambda
        run: |
          # Crear una carpeta temporal para empaquetar
          TEMP_DIR=$(mktemp -d)
          cp -R ./stage_lib/* $TEMP_DIR/

          # Crear paquetes individuales por subdirectorio dentro de stage_lib
          for dir in $(find $TEMP_DIR -type d); do
            RELATIVE_PATH=${dir#$TEMP_DIR/}
            ZIP_FILE=${RELATIVE_PATH}.zip
            ZIP_DEST="lambda/${RELATIVE_PATH}/src"
            
            # Evitar errores en el directorio raíz vacío
            if [ "$RELATIVE_PATH" != "$TEMP_DIR" ]; then
              echo "Empaquetando $RELATIVE_PATH en $ZIP_FILE..."
              zip -r $ZIP_FILE $dir/*
              
              # Subir a S3 dinámicamente
              echo "Subiendo $ZIP_FILE a s3://$AWS_BUCKET_NAME/$ZIP_DEST/$ZIP_FILE..."
              aws s3 cp $ZIP_FILE s3://$AWS_BUCKET_NAME/$ZIP_DEST/
            fi
          done

          # Limpiar el directorio temporal
          rm -rf $TEMP_DIR

          # Desplegar la plantilla SAM
          sam package \
            --template-file templates/lambda.yaml \
            --s3-bucket $AWS_BUCKET_NAME \
            --s3-prefix lambda \
            --output-template-file packaged-template.yaml

          sam deploy \
            --template-file packaged-template.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --region $REGION \
            --parameter-overrides \
              ParameterKey=Stage,ParameterValue=$ENVIRONMENT \
              ParameterKey=AWSRegion,ParameterValue=$REGION \
              ParameterKey=LIBbucket,ParameterValue=$AWS_BUCKET_NAME


      # Despliegue del stack Athena
      - name: Deploy ATHENA
        id: athena
        if: contains(github.event.pull_request.title, '-athena') || contains(github.event.pull_request.title, '-all')
        run: |
          aws cloudformation deploy --template-file templates/athena.yaml \
            --region $REGION \
            --stack-name da-josemaria-athena \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides Stage=$ENVIRONMENT \
              AWSRegion=$REGION AWSAccountId=$AWS_ACCOUNT_ID
